buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Configure lint for all projects before they are evaluated
gradle.beforeProject { project ->
    if (project.path != ':app') {
        project.afterEvaluate {
            if (it.hasProperty('android')) {
                it.android {
                    lintOptions {
                        abortOnError false
                        checkReleaseBuilds false
                        checkDependencies false
                        quiet true
                        disable 'SuspiciousIndentation', 'all'
                    }
                }
            }
        }
    }
}

// add CredoLab maven repository Frodriguez
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url("$rootDir/../node_modules/react-native/android") }
        maven { url 'https://www.jitpack.io' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url "https://dl.cloudsmith.io/KzfLB1RYYNCXNqr9/credolab/proxyen-sdk/maven/" }
    }
}
// end CredoLab addition Frodriguez