
plugins {
    id 'io.sentry.android.gradle' version '5.8.0'
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Remove the envConfigFiles mapping since we're using ENVFILE directly
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * def jscFlavor = 'org.webkit:android-jsc-intl:+'
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. Date.toLocaleString and String.localeCompare that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.cuota"
    defaultConfig {
        applicationId "com.cuota"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "1.0.16"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
        buildConfigField "boolean", "IS_HERMES_ENABLED", "true"
         buildConfigField "String", "API_URL", "\"https://api-staging.cuotaapp.com/api/\""
        resValue "string", "app_name", "creditivoo"
        manifestPlaceholders = [
            appIcon: "@mipmap/ic_launcher",
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(CREDITIVOO_UPLOAD_STORE_FILE)
            storePassword CREDITIVOO_UPLOAD_STORE_PASSWORD
            keyAlias CREDITIVOO_UPLOAD_KEY_ALIAS
            keyPassword CREDITIVOO_UPLOAD_KEY_PASSWORD
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    applicationVariants.all { variant ->
    variant.outputs.all {
            if (variant.buildType.name == "release") {
                outputFileName = "Ivo-${variant.buildType.name}-${defaultConfig.versionName}-${defaultConfig.versionCode}.apk"
            }
        }
    }

    buildFeatures {
        buildConfig = true
        aidl = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        // Use lint.xml configuration file
        lintConfig file("${rootProject.projectDir}/lint.xml")
        // Ignore lint errors in external dependencies
        disable 'SuspiciousIndentation'
        // Don't check dependencies
        checkDependencies false
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"

    implementation 'androidx.security:security-crypto:1.0.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation project(':react-native-config')

    implementation 'com.google.android.gms:play-services-location:21.0.1' // versión ejemplo

    
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.okhttp:okhttp-urlconnection:2.7.5'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava:2.9.0'
    implementation 'com.squareup.okio:okio:3.2.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-rxjava2:2.6.1'
    implementation 'androidx.room:room-guava:2.6.1'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'

    implementation("com.squareup.retrofit2:retrofit:2.9.0")
    implementation("com.squareup.retrofit2:converter-gson:2.9.0")
    
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'me.pushy:sdk:1.0.112'
    
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'com.scottyab:rootbeer-lib:0.1.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.2")
    implementation("androidx.activity:activity-compose:1.8.0")
    implementation("androidx.compose.ui:ui:1.5.1")
    implementation("androidx.compose.ui:ui-tooling-preview:1.5.1")
    implementation("androidx.compose.material3:material3:1.1.1")
    implementation("androidx.appcompat:appcompat:1.7.1")

    // Firebase - Removed (not using Firebase)

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'com.googlecode.libphonenumber:libphonenumber:6.2'

    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    implementation "androidx.work:work-runtime-ktx:2.8.1"
}

sentry {
    org = "personal-jzz"
    projectName = "cuota-app"

    // Disable source context upload to avoid auth token requirement during build
    // If you need source context, configure SENTRY_AUTH_TOKEN environment variable
    // and set includeSourceContext = true
    includeSourceContext = false
    autoUploadProguardMapping = false
    uploadNativeSymbols = false
    includeNativeSources = false
}

// Disable Sentry bundle sources task if no auth token is configured
tasks.whenTaskAdded { task ->
    if (task.name.contains("sentryBundleSources") && System.getenv("SENTRY_AUTH_TOKEN") == null) {
        task.enabled = false
    }
}
